<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdp</title>

<!--
  見た目は GitHub の README 表示に寄せている。CSS/JS は jsdelivr から読む。
  バージョンは意図的に固定してあり、上げるときは modules/mdp/template.html を
  まとめて書き換えること (CSS と JS でバージョンがずれると配色が崩れる)。
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-github-alerts@1.0.1/styles/github-base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-github-alerts@1.0.1/styles/github-colors-light.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-github-alerts@1.0.1/styles/github-colors-dark-media.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">

<style>
  :root { color-scheme: light dark; }

  /* github-markdown-css の変数は .markdown-body の中でしか効かないため、
     ページ全体の地色はここで別に指定する。値は GitHub の canvas に合わせた。 */
  body { margin: 0; background: #ffffff; }
  @media (prefers-color-scheme: dark) { body { background: #0d1117; } }

  .markdown-body {
    box-sizing: border-box;
    max-width: 1012px;   /* GitHub のコンテンツ幅 */
    margin: 0 auto;
    padding: 32px 32px 96px;
  }
  @media (max-width: 767px) { .markdown-body { padding: 16px 16px 64px; } }

  /* hljs のテーマが持つ背景色は github-markdown-css 側と二重になるので消す。 */
  .markdown-body pre code.hljs { background: transparent; padding: 0; }

  /* Mermaid は描画完了まで生テキストが見えてしまうので、それまで隠す。 */
  .markdown-body pre.mermaid { background: transparent; text-align: center; }
  .markdown-body pre.mermaid:not([data-processed]) { visibility: hidden; }

  /* 状態表示。読み込み中と切断時だけ出る。 */
  #status {
    position: fixed; right: 12px; bottom: 12px;
    padding: 6px 12px; border-radius: 6px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, monospace;
    background: #6e7781; color: #ffffff;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #status[data-show] { opacity: .9; }
  #status[data-kind="error"] { background: #cf222e; }
</style>
</head>

<body>
<article id="content" class="markdown-body"></article>
<div id="status"></div>

<script type="module">
import markdownit from 'https://cdn.jsdelivr.net/npm/markdown-it@15.0.0/dist/browser/markdown-it.esm.min.mjs'
import hljs from 'https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/+esm'
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs'
import * as alerts from 'https://cdn.jsdelivr.net/npm/markdown-it-github-alerts@1.0.1/+esm'
import * as katex from 'https://cdn.jsdelivr.net/npm/@vscode/markdown-it-katex@1.1.2/+esm'
import * as taskLists from 'https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/+esm'
import * as footnote from 'https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/+esm'
import * as anchor from 'https://cdn.jsdelivr.net/npm/markdown-it-anchor@9.2.1/+esm'

/**
 * プラグイン本体を取り出す。
 * CJS 由来のものは CDN 側の変換で default が何重かに包まれることがあり
 * (@vscode/markdown-it-katex は default.default に関数が入る)、
 * 関数に行き当たるまで剥がす必要がある。
 */
const plugin = (mod) => {
  let p = mod
  while (p && typeof p !== 'function' && p.default) p = p.default
  return p
}

const POLL_INTERVAL = 1000
const darkMode = window.matchMedia('(prefers-color-scheme: dark)')

const escapeHtml = (s) =>
  s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/** GitHub の見出し ID 生成規則。目次からのジャンプを効かせるために揃える。 */
const slugify = (s) =>
  s.trim().toLowerCase()
    .replace(/[^\p{L}\p{N}\p{M}\s-]/gu, '')
    .replace(/\s+/g, '-')

const md = markdownit({
  html: true,       // GitHub も一部の生 HTML を通す
  linkify: true,    // 裸の URL を自動リンク化
  typographer: false,
  breaks: false,    // README と同じ扱い (単独改行は改行しない)
  highlight(code, lang) {
    const language = lang && hljs.getLanguage(lang) ? lang : null
    const body = language
      ? hljs.highlight(code, { language, ignoreIllegals: true }).value
      : escapeHtml(code)
    // <pre> から始まる文字列を返すと markdown-it は追加のラップをしない。
    return `<pre><code class="hljs${language ? ` language-${language}` : ''}">${body}</code></pre>`
  },
})
  .use(plugin(alerts))
  .use(plugin(katex))
  .use(plugin(taskLists))
  .use(plugin(footnote))
  .use(plugin(anchor), { slugify, permalink: false })

// ```mermaid は highlight ではなく図として描くので、fence ルールごと差し替える。
const renderFence = md.renderer.rules.fence
md.renderer.rules.fence = (tokens, idx, options, env, self) => {
  const token = tokens[idx]
  if (token.info.trim().split(/\s+/)[0] === 'mermaid') {
    return `<pre class="mermaid">${escapeHtml(token.content)}</pre>`
  }
  return renderFence(tokens, idx, options, env, self)
}

const configureMermaid = () => {
  const dark = darkMode.matches
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    // 矢印のラベルには既定で地色と無関係な色が敷かれ、暗い配色だと文字が沈む。
    // ページの背景と同じ色にして目立たなくする。
    themeVariables: { edgeLabelBackground: dark ? '#0d1117' : '#ffffff' },
  })
}
configureMermaid()

const content = document.getElementById('content')
const statusBar = document.getElementById('status')

const status = {
  show(text, kind = 'info') {
    statusBar.textContent = text
    statusBar.dataset.kind = kind
    statusBar.dataset.show = ''
  },
  hide() {
    delete statusBar.dataset.show
  },
}

async function render(source) {
  content.innerHTML = md.render(source.text)
  document.title = source.name

  const diagrams = content.querySelectorAll('pre.mermaid')
  if (diagrams.length) {
    try {
      await mermaid.run({ nodes: diagrams })
    } catch (e) {
      // 1つでも構文エラーがあると run 全体が落ちる。図以外は描けているので続行する。
      status.show(`mermaid: ${e.message ?? e}`, 'error')
      return
    }
  }
  status.hide()
}

/** サーバが持つ最新版の指紋。一致する間は本文が送られてこない。 */
let digest = ''

async function poll() {
  const res = await fetch(`/__mdp/src?digest=${encodeURIComponent(digest)}`)
  const source = await res.json()

  if (source.error) {
    status.show(source.error, 'error')
    return
  }
  if (source.unchanged) return

  digest = source.digest
  await render(source)
}

/** 次のポーリングまでの待ち。wake() で待たずに再開できる。 */
let wake = () => {}
const waitNextPoll = () =>
  new Promise((resolve) => {
    const timer = setTimeout(resolve, POLL_INTERVAL)
    wake = () => {
      clearTimeout(timer)
      resolve()
    }
  })

// 表示に必要な素材が揃うまでは真っ白なので、その間だけ知らせる。
status.show('読み込み中…')

async function loop() {
  while (true) {
    try {
      await poll()
    } catch {
      // サーバはブラウザを閉じると自分で終了する。ここに来るのは終了後か、
      // 端末側で止めた場合。再接続しても意味がないのでループを抜ける。
      status.show('mdp を終了しました', 'error')
      return
    }
    await waitNextPoll()
  }
}
loop()

// 背面のタブではポーリングが間引かれる。前面に戻った瞬間に取りに行くことで、
// 隠れている間の変更がすぐ反映される。
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') wake()
})

// 配色の切り替えに Mermaid だけは追従できない (描画済みの SVG に色が焼き付くため)。
darkMode.addEventListener('change', () => {
  configureMermaid()
  digest = ''  // 本文を取り直させ、図を描き直す
  wake()
})
</script>
</body>
</html>
